# Zabbix agent 2 UserParameters for Thimeo MicroMPX.
#
# Install as /etc/zabbix/zabbix_agent2.d/micrompx.conf, put micrompx-monitor in
# /usr/local/bin and restart zabbix-agent2.
#
# The [*] parameter is the port of the MicroMPX web interface; the template
# passes {$MICROMPX.PORT} (80 or 8080 - check the GUI URL).
UserParameter=micrompx.loss[*],/usr/local/bin/micrompx-monitor --host 127.0.0.1 --port $1 widget 23185 --format value
UserParameter=micrompx.level[*],/usr/local/bin/micrompx-monitor --host 127.0.0.1 --port $1 widget 20252 --format value
UserParameter=micrompx.backup[*],/usr/local/bin/micrompx-monitor --host 127.0.0.1 --port $1 widget 7966 --format value
UserParameter=micrompx.inputs[*],/usr/local/bin/micrompx-monitor --host 127.0.0.1 --port $1 widget 8431 --format value
UserParameter=micrompx.udp.port[*],/usr/local/bin/micrompx-monitor --host 127.0.0.1 --port $1 widget 4647 --format value
UserParameter=micrompx.delay[*],/usr/local/bin/micrompx-monitor --host 127.0.0.1 --port $1 widget 4648 --format value
UserParameter=micrompx.version[*],/usr/local/bin/micrompx-monitor --host 127.0.0.1 --port $1 widget 21078 --format value
UserParameter=micrompx.description[*],/usr/local/bin/micrompx-monitor --host 127.0.0.1 --port $1 widget 20855 --format value
UserParameter=micrompx.rist.source[*],/usr/local/bin/micrompx-monitor --host 127.0.0.1 --port $1 widget 9727 --format value
