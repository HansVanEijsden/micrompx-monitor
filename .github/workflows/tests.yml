name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest interpreter the test runner still supports; the
        # tool itself claims 3.8, which is the same syntax but needs pytest 8.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run the test suite
        run: python -m pytest

      - name: Smoke-test the single file as installed
        run: |
          ./micrompx-monitor --version
          ./micrompx-monitor metrics
